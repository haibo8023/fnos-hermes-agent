name: Sync Upstream & Build & Release

on:
  # 手动触发（随时可点）
  workflow_dispatch:
    inputs:
      force_build:
        description: '强制构建（跳过「上游未影响运行时则跳过」闸门；用于 fpk/打包脚本类修复。需自行推进 VERSION，版本未变仍会自动跳过）'
        type: boolean
        default: false
  # 定时自动同步官方上游：有新版本/新提交就自动 构建 → 包内校验 → 收敛仓库 → 发布 Release；
  # 上游无变化时 sync-upstream.js 直接退出、后续步骤全部跳过（安静、无任何副作用）。
  # UTC 02:10 / 14:10 = 北京时间 10:10 / 22:10。
  # 注：仓库连续 60 天无活动时 GitHub 会自动停用 schedule（会邮件提醒，重新启用即可）。
  schedule:
    # TEMP(2026-10-10): 验证「转独立仓库后 fork 的 schedule 限制是否解除」
    - cron: '*/20 * * * *'
    - cron: '10 2,14 * * *'

permissions:
  contents: write

jobs:
  sync-build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # 配置 git（publish/build 需要）
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config remote.origin.url "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git tag --sort=-creatordate | head -3 || true

      # 检测上游版本 + 更新 VERSION（无新提交时脚本直接退出，后续步骤跳过）
      - name: Detect upstream & bump version
        id: version
        run: |
          node scripts/sync-upstream.js
          # force_build 只负责打开下面的「无运行时变化则跳过」闸门，不再自增版本号：
          # 版本必须由提交者手动推进，否则版本未变会被 Check version changed 跳过。
          # （2026-09-29 实测教训：自动自增 + 重复 dispatch → 版本从 .06 连推到 .08。）
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # 拉取上游（官方 monorepo，运行时核心在仓库根）
      - name: Clone upstream
        run: |
          if [ ! -d "upstream/.git" ]; then
            git clone --depth 1 https://github.com/NousResearch/hermes-agent.git upstream
          else
            (cd upstream && git fetch --depth 1 origin main && git reset --hard origin/main)
          fi
          echo "upstream version: $(grep -m1 '^version' upstream/pyproject.toml)"

      - name: Check version changed
        id: check
        run: |
          PREV_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          echo "prev_tag=$PREV_TAG"
          echo "new_version=${{ steps.version.outputs.version }}"
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" = "v${{ steps.version.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "版本未变化，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 受控合并（移植原则）：只同步官方运行时核心到 app/hermes-src，
      # 桌面端( apps/native/web/website/docs/evals )与 tests 排除，
      # 移植修改(PORT_OVERRIDES: server.py/methods_config.py/web_server.py)保留
      - name: Merge upstream (受控合并)
        if: steps.check.outputs.changed == 'true'
        run: |
          node scripts/merge-upstream.js --upstream upstream --write

      # 受控合并后判断是否真的产生了运行时变化：上游只改 docs/website/CI 这类
      # 非运行时文件时，app/hermes-src 不会有变化 —— 此时回滚版本号、跳过构建与发布，
      # 只把 .upstream-state 前移（由下一个 Commit/Push 步骤落库），避免发布"空版本"
      # 把版本号推高（2026-09-23 实测：docs 提交让 VERSION 从 .02 一路涨到 .04）。
      - name: Detect runtime changes
        id: rt
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          changes="$(git status --porcelain app/hermes-src)"
          if [ -n "$changes" ] || [ "${{ inputs.force_build }}" = "true" ]; then
            echo "runtime_changed=true" >> "$GITHUB_OUTPUT"
            echo "◈ app/hermes-src 有运行时变化："
            printf '%s\n' "$changes" | head -20 || true
          else
            echo "runtime_changed=false" >> "$GITHUB_OUTPUT"
            echo "◈ 上游提交未影响运行时（app/hermes-src 无变化）→ 本轮只记录上游状态，不构建不发布"
            git checkout -- VERSION
          fi

      # 先提交合并结果（build.sh 增量包 diff 需要 HEAD 包含合并）
      - name: Commit sync & merge
        if: steps.check.outputs.changed == 'true'
        run: |
          git add VERSION .upstream-state app/hermes-src scripts/merge-upstream.js
          git commit -m "sync: 上游 ${{ steps.version.outputs.version }} 受控合并（保留移植修改）" --allow-empty || true

      # venv-bundle（约 70MB，不提交仓库）
      #   1) 首选本仓库 Release 载体资产 venv-bundle.tar.gz（tag=venv-bundle-py314-0.21.6.05）
#      布局：venv/ + python/（自带 CPython 3.14；上游 0.21.6 起运行时要求 Python >=3.12）
      #   2) 兜底：从本仓库最近一个 .fpk Release 里解包提取（不再依赖任何外部仓库）
      - name: Fetch venv-bundle
        if: steps.check.outputs.changed == 'true' && steps.rt.outputs.runtime_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p fpk
          if [ -f fpk/venv-bundle.tar.gz ]; then
            echo "✓ venv-bundle 已存在于工作区"
          else
            VENV_TAG="venv-bundle-py314-0.21.6.05"
            VENV_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VENV_TAG}/venv-bundle.tar.gz"
            echo "◈ 尝试本仓库载体: $VENV_URL"
            if curl -fsSL -o fpk/venv-bundle.tar.gz "$VENV_URL"; then
              echo "✓ 已获取本仓库 venv-bundle（tag=${VENV_TAG}，$(du -h fpk/venv-bundle.tar.gz | cut -f1)）"
            else
              echo "⚠ 本仓库载体不可用，回退：从上一版 .fpk 解包提取"
              rm -f fpk/venv-bundle.tar.gz
              FPK_URL="$(curl -sS -H "Authorization: token ${GITHUB_TOKEN}" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
                | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((a['browser_download_url'] for r in d for a in r.get('assets',[]) if a['name'].endswith('.fpk')),''))" 2>/dev/null || true)"
              [ -n "$FPK_URL" ] && echo "◈ 兜底取本仓库 .fpk: $FPK_URL"
              [ -n "$FPK_URL" ] || { echo "✗ 找不到 venv-bundle 来源（载体不可用且无 .fpk）" >&2; exit 1; }
              curl -fsSL -o /tmp/prev.fpk "$FPK_URL"
              (cd /tmp && rm -rf prevpkg && mkdir -p prevpkg \
                && tar xzf prev.fpk -C prevpkg app.tgz \
                && VENV_MEMBER="$(tar tzf prevpkg/app.tgz | grep -E '(^|/)venv-bundle[^/]*\.tar\.gz$' | head -1)" \
                && [ -n "$VENV_MEMBER" ] && echo "venv-bundle 成员: $VENV_MEMBER" \
                && tar xzf prevpkg/app.tgz -C prevpkg "$VENV_MEMBER" \
                && mv "prevpkg/$VENV_MEMBER" "$GITHUB_WORKSPACE/fpk/venv-bundle.tar.gz")
            fi
          fi
          ls -la fpk/venv-bundle.tar.gz && echo "✓ venv-bundle 就绪"

      - name: Build
        if: steps.check.outputs.changed == 'true' && steps.rt.outputs.runtime_changed == 'true'
        run: |
          bash scripts/build.sh

      # 包内校验：拦住「载荷缺包 / 版本号文件没更新」类事故（只有真机才暴露）
      - name: Verify package contents
        if: steps.check.outputs.changed == 'true' && steps.rt.outputs.runtime_changed == 'true'
        run: |
          set -euo pipefail
          FPK="$GITHUB_WORKSPACE/dist/fnos-hermes-agent_v$(cat "$GITHUB_WORKSPACE/VERSION").fpk"
          [ -f "$FPK" ] || { echo "✗ 未找到 $FPK" >&2; exit 1; }
          rm -rf /tmp/verify-pkg && mkdir -p /tmp/verify-pkg && cd /tmp/verify-pkg
          tar xzf "$FPK" app.tgz
          tar xzf app.tgz ./config/bootstrap/hermes-version.env ./hermes-src/hermes_platform/__init__.py
          WANT="$(cut -d. -f1-3 "$GITHUB_WORKSPACE/VERSION")"
          grep -qx "HERMES_VERSION=$WANT" ./config/bootstrap/hermes-version.env \
            || { echo "✗ hermes-version.env 版本不符（期望 $WANT）:" >&2; cat ./config/bootstrap/hermes-version.env >&2; exit 1; }
          tar tzf app.tgz > /tmp/pkg-list.txt
          grep -qE '(^|/)venv-bundle.*\.tar\.gz$' /tmp/pkg-list.txt \
            || { echo "✗ 包内缺 venv-bundle.tar.gz" >&2; exit 1; }
          grep -qE '(^|/)hermes-src/hermes_platform/__init__\.py$' /tmp/pkg-list.txt \
            || { echo "✗ 包内缺 hermes-src/hermes_platform" >&2; exit 1; }
          # 生命周期脚本必须带可执行位：fnOS 应用中心靠 fork/exec cmd/main 判断/启停应用，
          # 缺 x 位 → "fork/exec … permission denied" → 启动任务失败 10332「本地应用不允许启动」
          # → app 表 status 卡在 start → 桌面/应用中心打不开应用（2026-09-29 实测事故）
          CMD_MODE="$(tar tzvf "$FPK" cmd/main | awk '{print $1}')"
          [ "$CMD_MODE" = "-rwxr-xr-x" ] \
            || { echo "✗ 包内 cmd/main 权限异常: $CMD_MODE（应为 -rwxr-xr-x）" >&2; exit 1; }
          echo "✓ 包内 cmd/main 权限正确: $CMD_MODE"
          echo "✓ 包内校验通过：hermes_platform + venv-bundle 均在包内，目标版本 = $WANT"

      # 先收敛仓库（VERSION / .upstream-state / 受控合并结果），再发布 Release。
      # 顺序很重要：若反过来（先 Publish 后 Push），一旦 Push 失败就会留下
      # 「tag+Release 已建、main 的 VERSION 没前进」的僵局 —— 之后每轮都算出同一版本号、
      # Check version changed 判定 changed=false，CI 会永久空转（2026-09-23 实际踩过）。
      # 现在任一步失败，下一轮都能靠 tag 与 VERSION 的差异自愈。
      # ── 运行时冒烟：用包内 venv-bundle 自带的 Python 真跑一遍导入 ──
      # 2026-10-10 事故：上游 0.21.6 运行时要求 Python >=3.12（PEP 649 延迟注解 +
      # tarfile.extractall(filter=) 等 3.12+ API），而 bundle 还是 3.11.2 → 428 个模块
      # import 即 NameError，网关/仪表盘起不来，前端报 "Could not connect to Hermes gateway"。
      # 这一步专门拦「venv 与运行时不匹配」，比只看文件在不在强得多。
      - name: Smoke test runtime with bundled venv
        if: steps.check.outputs.changed == 'true' && steps.rt.outputs.runtime_changed == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/vbsmoke /tmp/vbsmoke-home && mkdir -p /tmp/vbsmoke /tmp/vbsmoke-home
          tar xzf fpk/venv-bundle.tar.gz -C /tmp/vbsmoke
          PY="$(ls -d /tmp/vbsmoke/python/cpython-3*-linux-*/bin/python3.[0-9]* 2>/dev/null | head -1 || true)"
          SP="$(ls -d /tmp/vbsmoke/venv/lib/python3.*/site-packages 2>/dev/null | head -1 || true)"
          [ -n "$PY" ] || { echo "✗ bundle 内未找到 CPython 解释器（新布局应为 python/cpython-*）" >&2; exit 1; }
          [ -n "$SP" ] || { echo "✗ bundle 内未找到 venv/lib/python3.*/site-packages" >&2; exit 1; }
          echo "bundle Python: $("$PY" --version 2>&1) | site-packages: $SP"
          HERMES_HOME=/tmp/vbsmoke-home PYTHONPATH="$PWD/app/hermes-src:$SP" "$PY" -c "
          import sys
          assert sys.version_info >= (3, 12), (
              f'bundle 的 Python 过旧（{sys.version.split()[0]}）：上游运行时自 0.21.6 起需要 >=3.12'
              '（PEP 649 延迟注解 / tarfile filter 等）。请重建 venv-bundle。')
          import gateway.config, hermes_cli.gateway, agent.context_engine, tools.terminal_tool, cron
          print('✓ 运行时导入冒烟通过（Python', sys.version.split()[0], '）')
          "
          echo "✓ venv-bundle 与 app/hermes-src 兼容"

      - name: Push
        if: steps.check.outputs.changed == 'true'
        run: |
          git push origin HEAD:main

      - name: Publish
        if: steps.check.outputs.changed == 'true' && steps.rt.outputs.runtime_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/publish.sh
